<body><main><header><a class="brand" href="./"><span class="brandmark">奶</span> 奶龙碰碰乐 <span class="edition">MERGE CLUB</span></a><span class="pill">碰一碰，长大一点</span></header><section class="layout"><aside class="intro"><div class="eyebrow">一只、两只……一大只！</div><h1>合成<br>大<span>奶龙</span><i>!</i></h1><p>把小小的快乐，<br>碰成大大的奶龙。</p><div class="scorebox"><span>本局得分</span><strong id="score">0</strong><div>目标 <b>9 级大奶龙</b><span>09 / MAX</span></div></div><div class="instructions"><b>玩法很简单</b><p><em>01</em> 左右移动，选好落点</p><p><em>02</em> 点击 / 松手，投下奶龙</p><p><em>03</em> 相同奶龙，按序升级</p></div><small>键盘：← → 瞄准 · 空格投放 · P 暂停</small></aside><section class="machine" aria-label="合成大奶龙游戏"><div class="machinebar"><span id="status" role="status">准备好，投下第一只！</span><button id="pause" title="暂停游戏">暂停</button></div><div class="playfield"><canvas id="game" width="410" height="650" tabindex="0" aria-label="游戏区域，使用左右方向键瞄准，空格投放奶龙"></canvas><div id="overlay" class="overlay" hidden><div><span class="eyebrow" id="overline">休息一下</span><h2 id="overlayTitle">已暂停</h2><p id="overlayText">奶龙在等你回来。</p><button id="resume" class="primary">继续游戏</button><button id="restartOverlay" class="secondary">重新开始</button></div></div></div><div class="machinefoot"><span><i></i> 相同奶龙碰一起就能合成</span><button id="restart">重新开始</button></div></section><aside class="collection"><div class="next"><span class="eyebrow">下一只登场</span><canvas id="next" width="160" height="160" aria-label="下一只奶龙"></canvas><b id="nextName">蹲蹲奶龙</b></div><div class="collectionhead"><h2>奶龙成长图鉴</h2><span>1 → 9 级</span></div><div id="levels"></div><div class="tip"><b>小小提示</b><p>给大奶龙留点空间。<br>堆过虚线 3 秒，挑战就结束啦。</p></div></aside></section><footer>一碰就开心 · 合成大奶龙 <span>非官方同人小游戏</span></footer></main><script src="game.js"></script></body></html>
